name: iOS App Store Build

on:
  # Manual trigger from GitHub UI or API
  workflow_dispatch:
    inputs:
      upload_to_appstore:
        description: 'Upload to App Store Connect'
        required: true
        default: 'false'
        type: boolean

  # Trigger on version tags (pre-release and release)
  push:
    branches:
      # Match the root branch and every branch whose name starts with "codex"
      # (for example codex/feature, codex-fix, and codex123).
      - 'codex**'
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

concurrency:
  # App Store Connect build numbers are global for an app version. Serialize
  # all codex branch builds so two branches cannot reserve the same number.
  group: decenza-pocket-ios-testflight
  cancel-in-progress: false

env:
  APP_STORE_CONNECT_APP_ID: '6797785923'
  INTERNAL_BETA_GROUP_ID: 'ffb703c8-c139-4b23-a424-252b07a1cfe9'

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for version tags

      - name: Pin Xcode 26.4.1
        # App Store requires the iOS 26 SDK (Xcode 26+). macos-26's default is
        # Xcode 26.2; pin 26.4.1 — the version Decenza's iOS CI builds with and
        # which the macos-26 runner has installed. The env-scrubbing clang shim
        # below is still required: 26.x clang hard-errors on the multiple
        # deployment-target env vars the runner pre-exports.
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          echo "DEVELOPER_DIR=/Applications/Xcode_26.4.1.app/Contents/Developer" >> $GITHUB_ENV

      - name: Install asc and configure App Store Connect authentication
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          ASC_VERSION='1.2.2'
          case "$(uname -m)" in
            arm64)
              ASC_ASSET="asc_${ASC_VERSION}_macOS_arm64"
              ASC_SHA256='a5ef2ee92760d671849d423be3206eec0a2d1a176a8f1bb61138f230b393391d'
              ;;
            x86_64)
              ASC_ASSET="asc_${ASC_VERSION}_macOS_amd64"
              ASC_SHA256='f417dc6b1cad0364d235883981c01e81fdfaf7a5b05ff9a010299bd026ddde0a'
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/asc-auth"
          curl --fail --location --retry 3 \
            "https://github.com/rudrankriyam/App-Store-Connect-CLI/releases/download/${ASC_VERSION}/${ASC_ASSET}" \
            --output "$RUNNER_TEMP/$ASC_ASSET"
          echo "$ASC_SHA256  $RUNNER_TEMP/$ASC_ASSET" | shasum -a 256 --check
          install -m 0755 "$RUNNER_TEMP/$ASC_ASSET" "$RUNNER_TEMP/bin/asc"

          ASC_PRIVATE_KEY_PATH="$RUNNER_TEMP/asc-auth/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o "$ASC_PRIVATE_KEY_PATH"
          chmod 600 "$ASC_PRIVATE_KEY_PATH"

          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "ASC_KEY_ID=$APP_STORE_CONNECT_API_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$APP_STORE_CONNECT_API_ISSUER_ID" >> "$GITHUB_ENV"
          echo "ASC_PRIVATE_KEY_PATH=$ASC_PRIVATE_KEY_PATH" >> "$GITHUB_ENV"
          echo "ASC_BYPASS_KEYCHAIN=true" >> "$GITHUB_ENV"

      - name: Reserve next App Store Connect build number
        id: bump
        run: |
          set -euo pipefail
          CURRENT=$(tr -d '[:space:]' < versioncode.txt)
          FILE_NEXT=$((CURRENT + 1))
          APP_VERSION=$(sed -nE 's/^project\(DecenzaPocket VERSION ([^ ]+) .*/\1/p' CMakeLists.txt)
          test -n "$APP_VERSION"

          ASC_BUILD_JSON=$(asc builds next-build-number \
            --app "$APP_STORE_CONNECT_APP_ID" \
            --version "$APP_VERSION" \
            --platform IOS \
            --output json)
          ASC_NEXT=$(jq -r '.nextBuildNumber' <<< "$ASC_BUILD_JSON")
          test "$ASC_NEXT" -ge 1

          if [ "$ASC_NEXT" -gt "$FILE_NEXT" ]; then
            NEXT="$ASC_NEXT"
          else
            NEXT="$FILE_NEXT"
          fi
          echo "$NEXT" > versioncode.txt
          echo "build_code=$NEXT" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "Version code bumped: $CURRENT -> $NEXT"
          echo "App version: $APP_VERSION"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          target: 'ios'
          arch: 'ios'
          modules: 'qtshadertools qtmultimedia qtwebsockets qtimageformats'
          cache: true
          cache-key-prefix: 'qt-ios-v1'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          # Key carries a shim-revision tag; bump it when the shim's env-scrub
          # list changes (ccache's compiler_check can't tell which env vars the
          # shim drops, so a key bump is the only reliable invalidation).
          key: ios-arm64-xcode26.4.1-s1
          max-size: 500M

      - name: Configure ccache for CI
        # %compiler% -v hashes the real compiler the shim execs, so an Xcode
        # upgrade auto-invalidates. (Shim-script edits still need a key bump.)
        run: ccache --set-config=compiler_check='%compiler% -v'

      - name: Replace Xcode clang/clang++ with env-scrubbing shims
        run: |
          # Xcode 26's clang hard-errors when the environment carries multiple
          # conflicting *_DEPLOYMENT_TARGET vars (the runner pre-exports them):
          #   error: conflicting deployment targets, both '26.2' and '17.0'...
          # It trips every bare clang call during `xcodebuild archive`: the
          # CMake compiler-ABI check AND the AUTOMOC moc_predefs script phase
          # (which calls clang directly, bypassing CMAKE_XCODE_ATTRIBUTE_CC, so
          # a ccache-wrapper-only approach can't catch it). Replace clang and
          # clang++ on the active Xcode with shims that unset ALL deployment-
          # target vars, then exec the real compiler. Target/SDK still arrive
          # via -target / -isysroot on the command line, so iOS is identified
          # correctly. (Root-cause fix borrowed from the Decenza iOS CI.)
          set -e
          XCODE_BIN="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/bin"
          for tool in clang clang++; do
            if [ -f "$XCODE_BIN/$tool" ] && [ ! -f "$XCODE_BIN/$tool.real" ]; then
              sudo mv "$XCODE_BIN/$tool" "$XCODE_BIN/$tool.real"
              sudo tee "$XCODE_BIN/$tool" >/dev/null <<EOF
          #!/bin/sh
          unset MACOSX_DEPLOYMENT_TARGET IPHONEOS_DEPLOYMENT_TARGET IPHONESIMULATOR_DEPLOYMENT_TARGET MACCATALYST_DEPLOYMENT_TARGET TVOS_DEPLOYMENT_TARGET WATCHOS_DEPLOYMENT_TARGET XROS_DEPLOYMENT_TARGET DRIVERKIT_DEPLOYMENT_TARGET
          exec "$XCODE_BIN/$tool.real" "\$@"
          EOF
              sudo chmod +x "$XCODE_BIN/$tool"
            fi
          done

      - name: Create ccache compiler wrappers
        run: |
          WRAPPER_DIR="$RUNNER_TEMP/ccache-wrappers"
          mkdir -p "$WRAPPER_DIR"
          CLANG=$(xcrun -f clang)
          CLANGPP=$(xcrun -f clang++)
          printf '#!/bin/sh\nif [ "$1" = "%s" ]; then shift; fi\nexec ccache "%s" "$@"\n' "$CLANG" "$CLANG" > "$WRAPPER_DIR/launch-c"
          printf '#!/bin/sh\nif [ "$1" = "%s" ]; then shift; fi\nexec ccache "%s" "$@"\n' "$CLANGPP" "$CLANGPP" > "$WRAPPER_DIR/launch-cxx"
          chmod +x "$WRAPPER_DIR/launch-c" "$WRAPPER_DIR/launch-cxx"
          echo "CCACHE_LAUNCH_C=$WRAPPER_DIR/launch-c" >> $GITHUB_ENV
          echo "CCACHE_LAUNCH_CXX=$WRAPPER_DIR/launch-cxx" >> $GITHUB_ENV

      - name: Install Apple certificate and provisioning profiles
        env:
          P12_CERTIFICATE_BASE64: ${{ secrets.P12_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/build_profile.mobileprovision
          WIDGET_PROFILE_PATH=$RUNNER_TEMP/widget_profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode from base64
          echo -n "$P12_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH
          echo -n "$WIDGET_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $WIDGET_PROFILE_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Install provisioning profiles (must use UUID as filename)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i $PROFILE_PATH))
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          echo "Installed main app profile with UUID: $PROFILE_UUID"
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

          WIDGET_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i $WIDGET_PROFILE_PATH))
          cp $WIDGET_PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$WIDGET_PROFILE_UUID.mobileprovision
          echo "Installed widget profile with UUID: $WIDGET_PROFILE_UUID"

      - name: Configure CMake
        env:
          MAIN_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
          WIDGET_PROFILE_NAME: ${{ secrets.WIDGET_PROVISIONING_PROFILE_NAME }}
        run: |
          mkdir -p build/ios
          cd build/ios
          # Wrap only CC/CXX with ccache (not LD/LDPLUSPLUS): pointing LD at
          # launch-c forces the C++ link through the `clang` driver and drops
          # the implicit -lc++. Once CC/CXX are non-Apple wrappers Xcode also
          # stops auto-adding the C++ runtime, so add -lc++ -lc++abi explicitly.
          $QT_ROOT_DIR/bin/qt-cmake ../.. -G Xcode \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_XCODE_ATTRIBUTE_CC="$CCACHE_LAUNCH_C" \
            -DCMAKE_XCODE_ATTRIBUTE_CXX="$CCACHE_LAUNCH_CXX" \
            -DCMAKE_XCODE_ATTRIBUTE_OTHER_LDFLAGS="-lc++ -lc++abi" \
            -DDECENZA_MAIN_PROFILE_SPECIFIER="$MAIN_PROFILE_NAME" \
            -DDECENZA_WIDGET_PROFILE_SPECIFIER="$WIDGET_PROFILE_NAME"

      - name: Build and Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd build/ios

          # Build archive
          xcodebuild archive \
            -project DecenzaPocket.xcodeproj \
            -scheme DecenzaPocket \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/DecenzaPocket.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=$TEAM_ID \
            CODE_SIGN_IDENTITY="iPhone Distribution"

      - name: Export IPA
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Unlock keychain for export
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH

          # Create export options plist
          cat > $RUNNER_TEMP/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>uploadSymbols</key>
              <true/>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>iPhone Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.janhagenclausen.DecenzaPocket</key>
                  <string>${{ secrets.PROVISIONING_PROFILE_NAME }}</string>
                  <key>com.janhagenclausen.DecenzaPocket.PowerWidget</key>
                  <string>${{ secrets.WIDGET_PROVISIONING_PROFILE_NAME }}</string>
              </dict>
          </dict>
          </plist>
          PLIST

          echo "Export options:"
          cat $RUNNER_TEMP/ExportOptions.plist

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/DecenzaPocket.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates

      - name: Upload to App Store Connect
        if: ${{ inputs.upload_to_appstore == true || startsWith(github.ref, 'refs/heads/codex') || startsWith(github.ref, 'refs/tags/v') }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "UPLOAD_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

          # altool expects the API key at this conventional path.
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$ASC_PRIVATE_KEY_PATH" ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          # Upload using altool
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/DecenzaPocket.ipa" \
            --type ios \
            --apiKey $APP_STORE_CONNECT_API_KEY_ID \
            --apiIssuer $APP_STORE_CONNECT_API_ISSUER_ID

      - name: Publish processed build to internal TestFlight testers
        if: ${{ inputs.upload_to_appstore == true || startsWith(github.ref, 'refs/heads/codex') || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail

          BUILD_JSON=$(asc builds wait \
            --app "$APP_STORE_CONNECT_APP_ID" \
            --build-number "${{ steps.bump.outputs.build_code }}" \
            --version "$APP_VERSION" \
            --platform IOS \
            --since "$UPLOAD_STARTED_AT" \
            --timeout 30m \
            --poll-interval 30s \
            --fail-on-invalid \
            --output json)
          BUILD_ID=$(jq -r '.buildId // .data.id' <<< "$BUILD_JSON")
          test -n "$BUILD_ID"
          test "$BUILD_ID" != 'null'

          # Keep export compliance deterministic even if App Store Connect
          # changes how it derives the value from Info.plist in the future.
          asc builds update \
            --build-id "$BUILD_ID" \
            --uses-non-exempt-encryption=false \
            --output json

          asc builds add-groups \
            --build-id "$BUILD_ID" \
            --group "$INTERNAL_BETA_GROUP_ID" \
            --output json

          for _ in $(seq 1 30); do
            INTERNAL_STATE=$(asc testflight distribution view \
              --build-id "$BUILD_ID" \
              --output json | jq -r '.data[0].attributes.internalBuildState')
            if [ "$INTERNAL_STATE" = 'IN_BETA_TESTING' ]; then
              echo "Build $BUILD_ID is available to internal TestFlight testers"
              exit 0
            fi
            echo "Waiting for internal TestFlight publication (state: $INTERNAL_STATE)"
            sleep 10
          done

          echo "Internal TestFlight publication did not reach IN_BETA_TESTING" >&2
          exit 1

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v7
        with:
          name: DecenzaPocket-iOS
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 1
          overwrite: true

      - name: Find dSYMs
        run: |
          echo "# Checking xcarchive dSYMs directory:"
          ls -la $RUNNER_TEMP/DecenzaPocket.xcarchive/dSYMs/ 2>/dev/null || echo "(empty or missing)"
          echo ""
          echo "# Checking build output:"
          ls -la build/ios/Release-iphoneos/*.dSYM 2>/dev/null || echo "(not in build output)"
          echo ""
          echo "# Searching workspace for all .dSYM bundles:"
          find $GITHUB_WORKSPACE -name "*.dSYM" -type d 2>/dev/null || echo "(none found in workspace)"
          find $RUNNER_TEMP -name "*.dSYM" -type d 2>/dev/null || echo "(none found in runner temp)"

      - name: Upload dSYMs for crash symbolication
        uses: actions/upload-artifact@v7
        with:
          name: DecenzaPocket-iOS-dSYMs
          path: |
            ${{ runner.temp }}/DecenzaPocket.xcarchive/dSYMs/
            build/ios/Release-iphoneos/*.dSYM
          retention-days: 90
          overwrite: true
          if-no-files-found: warn

      - name: Commit version code back to codex
        run: |
          BUILD_CODE="${{ steps.bump.outputs.build_code }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin codex
          git stash --include-untracked
          git checkout -B codex origin/codex
          echo "$BUILD_CODE" > versioncode.txt
          git add versioncode.txt
          if git diff --cached --quiet; then
            echo "No version code changes to commit"
          else
            git commit -m "ci: bump version code to $BUILD_CODE [skip ci]"
            PUSH_OK=false
            for attempt in 1 2 3; do
              if git push origin HEAD:codex; then
                echo "Committed version code $BUILD_CODE back to codex"
                PUSH_OK=true
                break
              else
                echo "Push failed (attempt $attempt/3), rebasing..."
                git pull --rebase origin codex
              fi
            done
            if [ "$PUSH_OK" != "true" ]; then
              echo "::warning::Could not push version code $BUILD_CODE back to master after 3 attempts"
            fi
          fi

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      - name: Warm main branch cache for next release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          IS_PRERELEASE=$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease' 2>/dev/null || echo "unknown")
          if [ "$IS_PRERELEASE" = "true" ] || [ "$IS_PRERELEASE" = "unknown" ]; then
            echo "Skipping cache warm for pre-release $TAG"
          else
            gh workflow run "$GITHUB_WORKFLOW" --ref codex || echo "Cache warm dispatch failed (non-fatal)"
          fi
